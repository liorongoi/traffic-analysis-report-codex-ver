[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "road-traffic-analysis"
version = "0.1.0"
description = "Independent offline road-traffic analysis domain foundation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
road-traffic = "road_traffic.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
